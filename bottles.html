<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99 Bottles of Beer</title>
    <style>
        :root {
            --bg-color: #f9f9fb;
            --text-color: #1c1c1e;
            --accent-color: #007aff;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        label {
            font-weight: 500;
            font-size: 16px;
        }

        input[type="number"] {
            width: 80px;
            padding: 8px 12px;
            border: 1px solid #c7c7cc;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            /* Prevents iOS zooming on input focus */
            font-size: 16px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            opacity: 0.8;
        }

        button.stop {
            background-color: #ff3b30;
            margin-top: 8px;
        }

        .lyric-box {
            background: #f1f1f4;
            padding: 16px;
            border-radius: 12px;
            min-height: 100px;
            text-align: center;
            font-size: 18px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍻 Beer on the Wall</h1>
    
    <div class="controls">
        <div class="input-group">
            <label for="bottleCount">Starting Bottles:</label>
            <input type="number" id="bottleCount" value="99" min="1" max="999">
        </div>
        <button id="startBtn">Start Singing</button>
        <button id="stopBtn" class="stop" style="display: none;">Stop</button>
    </div>

    <div class="lyric-box" id="lyricDisplay">
        Press "Start Singing" to begin!
    </div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const bottleInput = document.getElementById('bottleCount');
    const lyricDisplay = document.getElementById('lyricDisplay');

    let isPlaying = false;
    let currentCount = 0;
    let synth = window.speechSynthesis;
    let currentUtterance = null;

    // iOS Safari requires text-to-speech to be triggered directly by a user gesture (click/tap)
    startBtn.addEventListener('click', () => {
        if (isPlaying) return;
        
        currentCount = parseInt(bottleInput.value, 10) || 99;
        isPlaying = true;
        
        startBtn.style.display = 'none';
        stopBtn.style.display = 'block';
        bottleInput.disabled = true;

        singVerse();
    });

    stopBtn.addEventListener('click', () => {
        stopSinging();
    });

    function singVerse() {
        if (!isPlaying) return;

        if (currentCount > 0) {
            let nextCount = currentCount - 1;
            
            let line1 = `${currentCount} ${plural(currentCount)} of beer on the wall, ${currentCount} ${plural(currentCount)} of beer.`;
            let line2 = `Take one down and pass it around, ${nextCount === 0 ? 'no more' : nextCount} ${plural(nextCount)} of beer on the wall.`;
            
            let fullVerseText = `${line1} ${line2}`;
            
            // Update UI text visually 
            lyricDisplay.innerHTML = `${line1}<br><br>${line2}`;
            
            // Speak the verse
            speak(fullVerseText, () => {
                currentCount--;
                // Brief pause before the next verse
                setTimeout(singVerse, 600);
            });
        } else {
            let finalLine1 = "No more bottles of beer on the wall, no more bottles of beer.";
            let finalLine2 = `Go to the store and buy some more, ${bottleInput.value} bottles of beer on the wall.`;
            
            lyricDisplay.innerHTML = `${finalLine1}<br><br>${finalLine2}`;
            
            speak(`${finalLine1} ${finalLine2}`, () => {
                stopSinging();
            });
        }
    }

    function speak(text, callback) {
        // Cancel any lingering speech fragments
        synth.cancel();

        currentUtterance = new SpeechSynthesisUtterance(text);
        
        // Essential for iOS mobile safari compatibility to handle callbacks correctly
        currentUtterance.onend = () => {
            if (isPlaying) callback();
        };
        
        currentUtterance.onerror = (event) => {
            console.error("Speech error", event);
            if (isPlaying) callback();
        };

        // Standard setups
        currentUtterance.rate = 1.0; 
        currentUtterance.pitch = 1.0;

        synth.speak(currentUtterance);
    }

    function stopSinging() {
        isPlaying = false;
        synth.cancel();
        
        startBtn.style.display = 'block';
        stopBtn.style.display = 'none';
        bottleInput.disabled = false;
        lyricDisplay.innerText = "Stopped. Press 'Start Singing' to begin again.";
    }

    function plural(count) {
        return count === 1 ? "bottle" : "bottles";
    }
</script>

</body>
</html>
